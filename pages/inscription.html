<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="../node_modules\bootstrap\dist\css\bootstrap.min.css" rel="stylesheet">
    <link href="../node_modules\bootstrap-icons\font\bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <span>Vite &amp; Gourmand</span>
        <nav>
            <ul>
                <li><a href="../index.html">Accueil</a></li>
                <li><a href="../pages/nos-menus.html">Nos menus</a></li>
                <li><a href="../pages/connexion.html">Connexion</a></li>
                <li><a href="../pages/contact.html">Contact</a></li>
            </ul>
        </nav>
        <button aria-label="Ouvrir le menu" class="burger-menu"><i class="bi bi-list"></i></button>
    </header> 
    
    <main class="main-connexion">
        <h2 class="class-commande">Inscription</h2>
        <div class="connexion">
        <label>Nom:</label>
        <input type="text">
        </div>
        <div class="connexion">
        <label>Prénom:</label>
        <input type="text">
        </div>
        <div class="connexion">
        <label>Tél:</label>
        <input type="tel">
        </div>
        <div class="connexion">
        <label>Adresse:</label>
        <input type="text">
        </div>
        <div class="connexion">
        <label for="zipcode">Code postal :</label>
            <input 
            type="text" 
            id="zipcode" 
            name="zipcode" 
            inputmode="numeric" 
            pattern="[0-9]{5}" 
            maxlength="5" 
            autocomplete="postal-code" 
            placeholder="Ex: 75001" 
            required>
        </div>
        <div class="connexion">
        <label>Ville:</label>
        <input type="text">
        </div>
        <div class="connexion">
        <label>Email:</label>
        <input type="email">
        </div>
        <div class="connexion">
        <label>Mot de passe:</label>
        <input type="password">
        </div>
        <p class="requis">10 caractères min, majuscule, minscule, caractère numérique, caractère spécial.</p>
        <div class="connexion">
        <label>Confirmation:</label>
        <input type="password">
        </div>
        <a href="#" aria-label="Valider" class="valider">Inscription</a>
    </main>    

    <footer>
        <div class="horaires">
            <h2>Nos horaires</h2>
            <p>Midi : 11h - 14h / Soir : 19h - 22h</p>
            <p>du lundi au dimanche</p>
        </div>
        <div class="mentions">
            <a href="#">mentions légales</a>
            <a href="#">CGV</a>
        </div>
    </footer>
    <script src="../js/script.js"></script>
    <script src="../node_modules\bootstrap\dist\js\bootstrap.bundle.min.js"></script>

</body>
</html>
